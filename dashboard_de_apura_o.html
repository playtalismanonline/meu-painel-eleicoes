<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSE SECURE LINK // APURAÇÃO 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Base e Fontes */
        body { 
            background-color: #050505; 
            color: #e0e0e0;
            overflow-x: hidden;
        }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .font-rajdhani { font-family: 'Rajdhani', sans-serif; }
        
        /* Efeitos Neon e HUD */
        .neon-text-cyan {
            text-shadow: 0 0 5px rgba(34, 211, 238, 0.8), 0 0 15px rgba(34, 211, 238, 0.5);
        }
        .neon-text-fuchsia {
            text-shadow: 0 0 5px rgba(217, 70, 239, 0.8), 0 0 15px rgba(217, 70, 239, 0.5);
        }
        .neon-text-red {
            text-shadow: 0 0 5px rgba(239, 68, 68, 0.8), 0 0 15px rgba(239, 68, 68, 0.5);
        }
        
        .hud-border {
            border: 1px solid rgba(34, 211, 238, 0.3);
            box-shadow: inset 0 0 20px rgba(34, 211, 238, 0.05), 0 0 15px rgba(34, 211, 238, 0.1);
            background: linear-gradient(135deg, rgba(10, 10, 10, 0.9) 0%, rgba(20, 20, 25, 0.8) 100%);
            backdrop-filter: blur(10px);
            position: relative;
        }
        .hud-border::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px;
            width: 15px; height: 15px;
            border-top: 2px solid #22d3ee;
            border-left: 2px solid #22d3ee;
        }
        .hud-border::after {
            content: '';
            position: absolute;
            bottom: -1px; right: -1px;
            width: 15px; height: 15px;
            border-bottom: 2px solid #22d3ee;
            border-right: 2px solid #22d3ee;
        }

        /* Scanlines Overlay */
        .scanlines {
            position: fixed;
            top: 0; left: 0; w-full; h-full;
            width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.6;
        }

        /* Animações */
        .transition-width { transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.3; } }
        
        .progress-glow-cyan {
            box-shadow: 0 0 10px #22d3ee, 0 0 20px #22d3ee;
        }
        .progress-glow-fuchsia {
            box-shadow: 0 0 10px #d946ef, 0 0 20px #d946ef;
        }
        
        /* Grid background pattern */
        .cyber-grid {
            background-image: 
                linear-gradient(rgba(34, 211, 238, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 211, 238, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: center center;
        }
    </style>
</head>
<body class="cyber-grid min-h-screen relative pb-10">
    <div class="scanlines"></div>

    <!-- Header HUD -->
    <header class="border-b border-cyan-500/30 bg-black/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 border-2 border-cyan-400 rounded-full flex items-center justify-center relative">
                    <div class="absolute inset-0 rounded-full border border-cyan-400 animate-ping opacity-20"></div>
                    <svg class="w-6 h-6 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                </div>
                <div>
                    <h1 class="font-orbitron text-xl sm:text-2xl font-bold tracking-widest text-white neon-text-cyan">TSE_DATALINK // 2026</h1>
                    <p class="font-rajdhani text-cyan-500/80 text-sm tracking-[0.2em] uppercase mt-0.5">Sistema de Totalização Seguro</p>
                </div>
            </div>
            <div class="flex items-center gap-3 bg-red-950/40 border border-red-500/50 px-4 py-2 rounded">
                <div class="w-2.5 h-2.5 bg-red-500 rounded-full blink" style="box-shadow: 0 0 8px #ef4444;"></div>
                <span class="font-orbitron text-xs font-bold tracking-widest text-red-400 neon-text-red uppercase">Live Connection</span>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 mt-8 relative z-10">
        
        <!-- Status Header (Main Progress) -->
        <div class="hud-border p-6 rounded-sm mb-8 flex flex-col sm:flex-row justify-between items-center gap-6">
            <div class="w-full sm:w-1/2">
                <h2 class="font-orbitron text-cyan-400 text-sm tracking-[0.15em] mb-2 uppercase">URNAS APURADAS</h2>
                <div class="w-full bg-gray-900 border border-cyan-500/30 h-6 p-0.5 relative overflow-hidden">
                    <div id="progress-bar" class="bg-cyan-400 h-full progress-glow-cyan transition-width flex items-center justify-end px-2" style="width: 0%">
                        <div class="w-1 h-3 bg-white/50 animate-pulse"></div>
                    </div>
                    <!-- Grid Overlay on progress bar -->
                    <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPjxyZWN0IHdpZHRoPSI0IiBoZWlnaHQ9IjQiIGZpbGw9InRyYW5zcGFyZW50Ii8+PGxpbmUgeDE9IjAiIHkxPSIwIiB4Mj0iMCIgeTI9IjQiIHN0cm9rZT0icmdiYSgwLDAsMCwwLjUpIiBzdHJva2Utd2lkdGg9IjEiLz48L3N2Zz4=')] opacity-50"></div>
                </div>
                <p class="font-rajdhani text-gray-400 text-xs mt-2 uppercase flex items-center gap-2">
                    <span class="w-1.5 h-1.5 bg-cyan-500 inline-block rounded-full"></span>
                    Sync: <span id="timestamp" class="text-cyan-300">Inicializando...</span>
                </p>
            </div>
            
            <div class="w-full sm:w-auto text-center sm:text-right">
                <div class="font-orbitron text-5xl md:text-6xl font-black text-white neon-text-cyan tracking-tight" id="progress-text">0.00%</div>
                <div class="font-rajdhani text-sm text-cyan-500/80 uppercase tracking-[0.2em] font-semibold mt-1">Status de Processamento</div>
            </div>
        </div>

        <!-- Error Message (Cyberpunk Style) -->
        <div id="error-message" class="hidden mb-8 border border-red-500/50 bg-red-950/20 p-4 relative overflow-hidden backdrop-blur-sm">
            <div class="absolute top-0 left-0 w-1 h-full bg-red-500 shadow-[0_0_10px_#ef4444]"></div>
            <div class="flex items-start gap-4">
                <svg class="w-6 h-6 text-red-500 flex-shrink-0 mt-0.5 blink" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <div>
                    <h3 class="font-orbitron text-red-500 font-bold tracking-wider text-sm mb-1 uppercase">Aviso do Sistema: Erro de Conexão TSE</h3>
                    <p class="font-rajdhani text-gray-300 text-sm">O link de dados oficial falhou (CORS/Bloqueio). <br><span class="text-yellow-400 font-bold">Iniciando protocolo de simulação visual (Fallback Mode ativado).</span></p>
                </div>
            </div>
        </div>

        <!-- Candidates Container -->
        <div class="space-y-4" id="candidates-container">
            <!-- Loading Skeleton HUD -->
            <div class="hud-border p-4 flex gap-4 items-center animate-pulse">
                <div class="w-12 h-12 border border-cyan-500/30 rounded bg-cyan-900/20"></div>
                <div class="flex-1 space-y-3">
                    <div class="h-4 bg-cyan-900/40 rounded w-1/3"></div>
                    <div class="h-2 bg-cyan-900/20 rounded w-full"></div>
                </div>
            </div>
        </div>

    </main>

    <script>
        // Configuração de Conexão solicitada pelo usuário
        const URL_ALVO = 'https://resultados.tse.jus.br/oficial/ele2026/544/dados-simplificados/br/br-c0001-e000544-r.json';
        const CORS_PROXY = 'https://corsproxy.io/?';
        const FETCH_URL = CORS_PROXY + encodeURIComponent(URL_ALVO);

        // Elementos UI
        const container = document.getElementById('candidates-container');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const timestamp = document.getElementById('timestamp');
        const errorMsg = document.getElementById('error-message');

        function formatarNumero(numStr) {
            // Substitui vírgula por ponto para JS e devolve formatado
            return parseFloat(numStr.replace(',', '.'));
        }

        function renderizarApuracao(dados) {
            // Atualiza barra de progresso total
            const pctApurado = formatarNumero(dados.pst);
            progressText.innerText = `${pctApurado.toFixed(2)}%`;
            progressBar.style.width = `${pctApurado}%`;
            
            // Atualiza Timestamp no estilo HUD
            const agora = new Date();
            const timeStr = agora.toISOString().split('T')[1].split('.')[0]; // HH:MM:SS
            timestamp.innerText = `SYS.TIME [${timeStr}]`;

            container.innerHTML = ''; // Limpa esqueletos

            // Ordena decrescente
            const candidatos = dados.cand.sort((a, b) => parseInt(b.vap) - parseInt(a.vap));

            candidatos.forEach((cand, index) => {
                const posicao = index + 1;
                const pct = formatarNumero(cand.pvap);
                const votosInt = parseInt(cand.vap).toLocaleString('pt-BR');
                
                // Tema de cores baseado na posição (1º = Cyan, 2º = Fuchsia, Resto = Cinza)
                const isLider = posicao === 1;
                const isSegundo = posicao === 2;
                
                let themeColor = 'text-gray-400';
                let barColor = 'bg-gray-600';
                let borderTheme = 'border-gray-700';
                let rankGlow = '';
                
                if (isLider) {
                    themeColor = 'text-cyan-400 neon-text-cyan';
                    barColor = 'bg-cyan-400 progress-glow-cyan';
                    borderTheme = 'border-cyan-500/50';
                    rankGlow = 'box-shadow: 0 0 10px rgba(34,211,238,0.2) inset';
                } else if (isSegundo) {
                    themeColor = 'text-fuchsia-400 neon-text-fuchsia';
                    barColor = 'bg-fuchsia-500 progress-glow-fuchsia';
                    borderTheme = 'border-fuchsia-500/40';
                    rankGlow = 'box-shadow: 0 0 10px rgba(217,70,239,0.2) inset';
                }

                // Tag de Status Eleito/2º Turno
                let statusBadge = '';
                if (cand.st) {
                    statusBadge = `<span class="ml-3 px-2 py-0.5 bg-gray-900 border ${borderTheme} text-xs font-orbitron tracking-widest ${themeColor.split(' ')[0]} uppercase">${cand.st}</span>`;
                }

                const cardHTML = `
                    <div class="hud-border bg-black/60 p-4 sm:p-5 flex flex-col sm:flex-row items-center gap-4 transition-all duration-300 hover:bg-gray-900/80">
                        
                        <!-- Rank Hexagon / Box -->
                        <div class="w-14 h-14 flex-shrink-0 border ${borderTheme} bg-black flex items-center justify-center relative transform rotate-45" style="${rankGlow}">
                            <span class="font-orbitron font-bold text-lg transform -rotate-45 ${themeColor.split(' ')[0]}">${posicao}</span>
                        </div>
                        
                        <!-- Info -->
                        <div class="flex-1 w-full pl-2 sm:pl-4">
                            <div class="flex flex-col sm:flex-row sm:justify-between sm:items-end mb-2 gap-2">
                                <div>
                                    <h3 class="font-orbitron text-xl font-bold text-white uppercase tracking-wide flex items-center">
                                        ${cand.nm} ${statusBadge}
                                    </h3>
                                    <p class="font-rajdhani text-gray-500 tracking-[0.1em] font-semibold mt-0.5">
                                        PARTIDO / COLIGAÇÃO: <span class="text-gray-300">${cand.cc}</span>
                                    </p>
                                </div>
                                <div class="text-left sm:text-right">
                                    <div class="font-orbitron text-2xl font-black ${themeColor}">${pct.toFixed(2)}%</div>
                                    <div class="font-rajdhani text-sm text-gray-400 uppercase tracking-widest">
                                        ${votosInt} VOTOS
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Candidate Progress Bar -->
                            <div class="w-full bg-gray-900/80 border border-gray-800 h-2 mt-2 relative overflow-hidden">
                                <div class="${barColor} h-full transition-width" style="width: ${pct}%"></div>
                            </div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        // Dados Falsos Futuristas para manter o layout se o proxy falhar
        function gerarDadosFallback() {
            return {
                pst: "87,42",
                cand: [
                    { nm: "ALPHA PRIME", cc: "NEXUS CORP", vap: "51234890", pvap: "49,15", st: "2º TURNO" },
                    { nm: "BETA SYNTH", cc: "COALIZÃO CYBER", vap: "48105000", pvap: "45,80", st: "2º TURNO" },
                    { nm: "DELTA NINE", cc: "FRONTEIRA TECH", vap: "3500200", pvap: "3,50", st: "" },
                    { nm: "OMEGA ZERO", cc: "SISTEMAS UNIDOS", vap: "1250110", pvap: "1,55", st: "" }
                ]
            };
        }

        // Core Fetch Logic
        async function conectarTSE() {
            try {
                // Header Accept ajuda com a requisição JSON
                const response = await fetch(FETCH_URL, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' },
                    cache: 'no-store'
                });
                
                if (!response.ok) throw new Error(`Falha no Uplink: HTTP ${response.status}`);
                
                const dados = await response.json();
                errorMsg.classList.add('hidden'); // Oculta erro
                renderizarApuracao(dados);
                
            } catch (error) {
                console.warn("CRITICAL: Conexão TSE falhou. Inicializando protocolo de fallback.", error);
                errorMsg.classList.remove('hidden'); // Exibe aviso Cyberpunk
                renderizarApuracao(gerarDadosFallback()); // Mantém o site bonito
            }
        }

        // Boot
        conectarTSE();
        
        // Loop infinito (a cada 30 segundos)
        setInterval(conectarTSE, 30000);

    </script>
</body>
</html>
